<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>Open Hours | Artifact Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<!-- Adobe Fonts kit used by the main site. -->
<link rel="preconnect" href="https://use.typekit.net">
<link rel="stylesheet" href="https://use.typekit.net/sak1ctd.css">
<!-- Reloads every 5 minutes so the dates and hours stay current. -->
<meta http-equiv="refresh" content="300">
<style>
/* Colours and type follow the Artifact Studio style guide (AGENTS.md):
   brand-bg #f1f8fd, brand-accent #2c3082, body text stone-900 #1c1917, muted stone-600 #57534e.
   Source Serif Pro (weight 400) for the heading, Akzidenz Grotesk Next Pro (500 and 900) for everything else.
   Old-Safari-safe: no flex gap, grid, custom properties, clamp() or inset. Sizes use vmin so portrait and landscape both fit. */
html, body { margin: 0; padding: 0; background: #f1f8fd; }
body {
  font-family: "akzidenz-grotesk-next-pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 500;
  color: #1c1917;
  -webkit-text-size-adjust: 100%;
}
.wrap { padding: 7vmin 7vmin 5vmin; }
h1 {
  margin: 0;
  font-family: "source-serif-pro", Georgia, "Times New Roman", serif;
  font-size: 12vmin; line-height: 1.05; font-weight: 400;
  color: #2c3082;
}
.range { margin: 1.6vmin 0 5vmin; font-size: 5vmin; color: #57534e; }
table { width: 100%; border-collapse: collapse; }
td {
  font-size: 6.2vmin; font-weight: 500;
  padding: 1.7vmin 0;
  border-top: 1px solid #d6d3d1;
  vertical-align: baseline;
  white-space: nowrap;
}
tr:first-child td { border-top: 0; }
td.day { width: 44%; padding-left: 2.4vmin; }
td.date { width: 24%; text-align: center; font-size: 4.2vmin; color: #57534e; }
td.hrs { width: 32%; text-align: right; padding-right: 2.4vmin; }
tr.today td { background: #2c3082; color: #f1f8fd; font-weight: 900; border-top-color: #2c3082; }
tr.today td.date { color: #f1f8fd; font-weight: 500; }
.status { margin: 5vmin 0 0; font-size: 5.4vmin; font-weight: 900; color: #2c3082; }
.stamp { margin: 2vmin 0 0; font-size: 3.4vmin; color: #78716c; }
@media (orientation: landscape) {
  h1 { font-size: 9vmin; }
  .range { font-size: 4vmin; margin-bottom: 3vmin; }
  td { font-size: 4.8vmin; padding: 1.1vmin 0; }
  td.date { font-size: 3.4vmin; }
  .status { font-size: 4.4vmin; margin-top: 3vmin; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Open Hours</h1>
  <!-- <p class="range" id="range">&nbsp;</p> -->
  <table>
    <tbody id="rows">
      <!-- Shown only if the script cannot run. -->
      <tr><td class="day" colspan="2">Hours unavailable</td><td class="hrs">See artifactstudio.nz</td></tr>
    </tbody>
  </table>
  <p class="status" id="status"></p>
  <p class="stamp" id="stamp"></p>
</div>

<script>
(function () {
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                'August', 'September', 'October', 'November', 'December'];

  // Normal week, Sunday first. o = opening hour, c = closing hour (24-hour clock). null = closed.
  var WEEKLY = [
    { o: 10, c: 14 },  // Sunday
    { o: 10, c: 16 },  // Monday
    null,              // Tuesday
    { o: 10, c: 16 },  // Wednesday
    { o: 10, c: 16 },  // Thursday
    { o: 10, c: 16 },  // Friday
    { o: 10, c: 14 }   // Saturday
  ];

  // One-off changes by date (YYYY-MM-DD). null = closed that day; {o, c} = different hours.
  // Examples:
  //   '2026-12-25': null,
  //   '2026-12-24': { o: 10, c: 12 }
  var EXCEPTIONS = {
  };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function h12(h) { return h === 0 ? 12 : (h > 12 ? h - 12 : h); }
  function ampm(h) { return h12(h) + (h < 12 ? 'am' : 'pm'); }
  function hoursFor(d) {
    var k = key(d);
    return EXCEPTIONS.hasOwnProperty(k) ? EXCEPTIONS[k] : WEEKLY[d.getDay()];
  }
  function span(x) { return x ? h12(x.o) + ' \u2013 ' + h12(x.c) : 'Closed'; }

  var now = new Date();
  var rows = '', first, last, i, d, x;

  for (i = 0; i < 7; i++) {
    d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    x = hoursFor(d);
    if (i === 0) { first = d; }
    if (i === 6) { last = d; }
    rows += '<tr' + (i === 0 ? ' class="today"' : '') + '>' +
            '<td class="day">' + DAYS[d.getDay()] + '</td>' +
            '<td class="date">' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + '</td>' +
            '<td class="hrs">' + span(x) + '</td></tr>';
  }
  document.getElementById('rows').innerHTML = rows;

  document.getElementById('range').innerHTML = (first.getMonth() === last.getMonth()) ?
    first.getDate() + ' \u2013 ' + last.getDate() + ' ' + MONTHS[last.getMonth()] :
    first.getDate() + ' ' + MONTHS[first.getMonth()] + ' \u2013 ' + last.getDate() + ' ' + MONTHS[last.getMonth()];

  var t = now.getHours() + now.getMinutes() / 60;
  var today = hoursFor(now);
  var status;
  if (today && t >= today.o && t < today.c) { status = 'Open now until ' + ampm(today.c); }
  else if (today && t < today.o) { status = 'Opens today at ' + ampm(today.o); }
  else { status = 'Closed now'; }
  document.getElementById('status').innerHTML = status;

  var hr = now.getHours();
  document.getElementById('stamp').innerHTML =
    'Updated ' + h12(hr) + ':' + pad(now.getMinutes()) + (hr < 12 ? 'am' : 'pm');
})();
</script>
</body>
</html>
